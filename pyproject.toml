[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lipi"
description = "Правила, каркас и чекер документации проекта"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
lipi = "lipi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lipi.__version__"}

[tool.setuptools.data-files]
# Полное описание сохраняет пути репозитория и относительные ссылки.
# `lipi guide` читает корневой SETUP.md из share/lipi.
"share/lipi" = ["README.md", "SETUP.md", "CHANGELOG.md"]
"share/lipi/docs/en" = ["docs/en/*.md"]
"share/lipi/docs/ru" = ["docs/ru/*.md"]
"share/lipi/docs/assets" = ["docs/assets/logo.png"]

[tool.setuptools.package-data]
lipi = [
    "locale/*/*.json",
    "locale/*/templates/**/*",
    "locale/*/templates/**/.*",
]
